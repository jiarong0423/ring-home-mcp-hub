<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title data-i18n="page.title"></title>
  <style>
    :root {
      --bg: #0b1019;
      --surface: #151d2a;
      --surface-2: #1d2939;
      --line: #304055;
      --text: #f2f6fa;
      --muted: #a8b7ca;
      --accent: #60dbbe;
      --accent-ink: #061e1a;
      --warn: #ffd18a;
      --danger: #ff9c9c;
      --shadow: 0 20px 60px rgba(0, 0, 0, .25);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--text); background: radial-gradient(circle at 80% -10%, #173449 0, transparent 34%), var(--bg); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .55; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .shell { width: min(1280px, calc(100% - 32px)); margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 24px 0 20px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid #4a9488; border-radius: 13px; background: #153a37; color: var(--accent); font-weight: 850; letter-spacing: -.05em; }
    .brand strong { display: block; font-size: 1.08rem; letter-spacing: .015em; }
    .brand small { color: var(--muted); }
    .header-side { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
    .badge { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border: 1px solid #867254; border-radius: 999px; color: var(--warn); background: #32291e; font-size: .78rem; font-weight: 800; letter-spacing: .08em; }
    .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px #ffd18a22; }
    .header-note { font-size: .78rem; color: var(--muted); }
    main { padding: 30px 0 60px; }
    .hero { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.65rem, 4vw, 2.45rem); letter-spacing: -.035em; }
    h2 { margin: 0; font-size: 1.18rem; letter-spacing: -.02em; }
    h3 { margin: 0; font-size: 1.03rem; }
    p { line-height: 1.55; }
    .hero p, .section-intro { margin: 0; color: var(--muted); }
    .hero-stats { display: flex; gap: 10px; }
    .connection { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 13px; color: var(--muted); font-size: .79rem; }
    .connection code { padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; color: #d5f5e9; background: #13232b; overflow-wrap: anywhere; }
    .stat { min-width: 94px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .stat strong { display: block; font-size: 1.35rem; }
    .stat span { color: var(--muted); font-size: .77rem; }
    .panel { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
    .login { max-width: 480px; margin: 52px auto 0; padding: 27px; }
    .login h2 { font-size: 1.45rem; }
    .login p { color: var(--muted); }
    .field { display: grid; gap: 7px; min-width: 0; }
    label { color: #dce6ef; font-size: .86rem; font-weight: 650; }
    input, select { width: 100%; min-height: 41px; padding: 9px 11px; border: 1px solid #526075; border-radius: 10px; background: #0d1521; color: var(--text); }
    input::placeholder { color: #7f91a6; }
    input[type="datetime-local"] { color-scheme: dark; }
    .hint { color: var(--muted); font-size: .78rem; }
    .button { display: inline-flex; justify-content: center; align-items: center; min-height: 39px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: var(--surface-2); font-weight: 670; transition: border-color .15s, background .15s; }
    .button:hover:not(:disabled) { border-color: var(--accent); background: #27403f; }
    .button.primary { color: var(--accent-ink); border-color: var(--accent); background: var(--accent); }
    .button.primary:hover:not(:disabled) { background: #8cebd3; }
    .button.danger { border-color: #9f6969; color: #ffe1e1; background: #42282d; }
    .button.small { min-height: 34px; padding: 6px 10px; font-size: .8rem; }
    .button.full { width: 100%; margin-top: 18px; }
    .notice { display: none; margin-bottom: 19px; padding: 11px 14px; border-radius: 11px; border: 1px solid #537c71; background: #1a3833; color: #d7f6eb; line-height: 1.45; }
    .notice.show { display: block; }
    .notice.error { border-color: #a56066; background: #42252c; color: #ffe4e5; }
    .ring-discovery { padding: 20px; margin-bottom: 24px; }
    .ring-discovery .section-intro { margin: 8px 0 15px; }
    .ring-discovery-controls { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; }
    .ring-discovery-controls .field { width: min(360px, 100%); }
    .ring-discovery output { display: block; margin-top: 13px; color: var(--muted); line-height: 1.5; }
    .cloud-mcp-labels { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
    .cloud-mcp-steps { counter-reset: none; }
    .cloud-mcp-steps li { justify-content: flex-start; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .cloud-mcp-steps li time { color: var(--muted); min-width: 92px; }
    .cloud-mcp-result[data-ok="true"] { color: var(--accent) !important; font-weight: 700; }
    .cloud-mcp-result[data-ok="false"] { color: var(--danger) !important; font-weight: 700; }
    .edge-panel { padding: 20px; margin-bottom: 24px; }
    .edge-panel .section-intro { margin: 8px 0 15px; }
    .edge-overview { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
    .edge-overview .status { align-self: auto; }
    .edge-controls { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 12px; }
    .edge-controls .button { flex: 0 1 auto; }
    .edge-summary { color: var(--muted); font-size: .82rem; line-height: 1.5; }
    .edge-panel h3 { margin-top: 20px; }
    .edge-receipts li { display: block; }
    .edge-receipts li strong { margin-bottom: 4px; }
    .edge-receipts li small { display: block; line-height: 1.5; }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 15px; margin: 27px 0 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(275px, 1fr)); gap: 14px; }
    .device { padding: 18px; min-height: 225px; display: flex; flex-direction: column; gap: 14px; }
    .device-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .device-icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; color: #aff3dd; background: #19453e; font-size: 1.35rem; }
    .device-title { flex: 1; }
    .device-title h3 { margin-top: 2px; }
    .device-title small { display: block; margin-top: 3px; color: var(--muted); font-size: .76rem; }
    .status { align-self: flex-start; padding: 4px 8px; border-radius: 999px; border: 1px solid #6b5a46; color: var(--warn); background: #3a3023; font-size: .7rem; white-space: nowrap; }
    .status.ready { border-color: #438775; color: var(--accent); background: #183f38; }
    .device-state { min-height: 38px; padding: 9px 11px; border-radius: 9px; background: #0e1825; color: #d4e0eb; font-size: .79rem; overflow-wrap: anywhere; }
    .device-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: auto; }
    .device-actions .button { flex: 1 1 auto; }
    .device-footnote { color: var(--muted); font-size: .73rem; }
    .columns { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 16px; align-items: start; }
    .section-panel { padding: 20px; }
    .section-panel .section-intro { margin: 5px 0 17px; font-size: .83rem; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
    .form-grid .wide { grid-column: 1 / -1; }
    .list { display: grid; gap: 9px; padding: 0; margin: 13px 0 0; list-style: none; }
    .list li { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 11px; border: 1px solid #344153; border-radius: 10px; background: #101a27; font-size: .8rem; }
    .list li strong { display: block; margin-bottom: 3px; }
    .list li small { color: var(--muted); overflow-wrap: anywhere; }
    .empty { color: var(--muted); font-size: .83rem; padding: 12px 0; }
    .audit { max-height: 355px; overflow: auto; }
    .audit li { display: block; }
    .audit .audit-top { display: flex; justify-content: space-between; gap: 8px; }
    .audit time { color: var(--muted); font-size: .72rem; white-space: nowrap; }
    .audit small { display: block; margin-top: 4px; }
    .dialog-backdrop { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: #03080cbd; }
    .dialog { width: min(100%, 460px); padding: 23px; }
    .dialog p { color: var(--muted); margin: 9px 0 18px; }
    .dialog .code { display: block; margin: 9px 0 15px; padding: 12px; border: 1px solid #5d776b; border-radius: 10px; color: var(--accent); background: #0e2824; font-size: 1.15rem; font-weight: 800; letter-spacing: .06em; overflow-wrap: anywhere; }
    .dialog-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .dialog-alert { color: var(--danger) !important; font-weight: 700; }
    .mock-mail { margin: 12px 0 17px; padding: 13px; border: 1px solid var(--line); border-radius: 12px; background: #0b1d27; }
    .mock-mail summary { cursor: pointer; font-weight: 750; }
    .mock-mail p { margin: 9px 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    [hidden] { display: none !important; }
    body[data-role="member"] .admin-only { display: none; }
    body:not([data-via="phone"]) .phone-only { display: none; }
    .care-note { margin-top: 12px; }
    .care-note-text { margin: 10px 0 4px; padding: 12px 14px; border-radius: 12px; background: #13202b; border: 1px solid #2c4053; line-height: 1.45; }
    .remote-phones li { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .guardian { margin-bottom: 24px; }
    .guardian-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .guardian-overall { margin: 10px 0 14px; padding: 14px 16px; border-radius: 14px; font-size: 1.35rem; font-weight: 800; background: #143a2f; color: #bff5e2; }
    .guardian-overall[data-state="attention"] { background: #4a2626; color: #ffd1d1; }
    .door-banner { margin: 0 0 14px; padding: 12px 14px; border: 2px solid #f2c94c; border-radius: 14px; background: #3a3216; }
    .door-banner p { margin: 0 0 8px; }
    .door-banner .door-ask { font-size: 1.15rem; font-weight: 800; }
    .door-banner img { display: block; width: 100%; max-width: 480px; border-radius: 10px; margin: 0 0 8px; }
    .door-actions { display: flex; gap: 10px; margin: 6px 0 8px; }
    .door-face { font-weight: 700; }
    .door-live { display: block; width: 100%; max-width: 480px; border-radius: 10px; margin: 8px 0; background: #000; }
    body[data-via="phone"] .hero, body[data-via="phone"] #cloud-mcp-panel { display: none; }
    .ring-connect-fold > summary { cursor: pointer; font-size: 1.25rem; font-weight: 800; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-height: 44px; }
    .pill-state { font-size: .95rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: #3a3216; color: #f2c94c; }
    .pill-state[data-state="ok"] { background: #143a2f; color: #bff5e2; }
    .ring-steps { list-style: none; padding: 0; margin: 14px 0 8px; display: grid; gap: 14px; }
    .ring-steps li { display: flex; gap: 12px; align-items: flex-start; }
    .ring-steps li > div { display: grid; gap: 8px; flex: 1; }
    .step-num { flex: none; width: 34px; height: 34px; border-radius: 50%; background: #5ee0b8; color: #0f1720; font-weight: 800; display: grid; place-items: center; }
    .ring-token-label { display: grid; gap: 6px; font-size: .9rem; color: #a9b8c6; }
    .faces-form { display: grid; gap: 10px; margin: 10px 0; }
    .faces-form label.consent { display: flex; gap: 10px; align-items: flex-start; }
    .faces-form label.consent input { min-height: 24px; min-width: 24px; }
    .door-actions .button { flex: 1; }
    .guardian-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .guardian-cards .stat span, .guardian-cards .stat small { display: block; }
    .guardian-cards .stat small { color: var(--muted); font-size: .72rem; margin-top: 4px; }
    .guardian-run[data-result="not_executed"], .guardian-run[data-result="unknown"], #guardian-events li[data-severity="alert"] { color: var(--danger); }
    #guardian-events li[data-severity="warn"] { color: var(--warn); }
    .phone-pair { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .phone-pair form { display: grid; gap: 12px; margin-top: 12px; }
    #phones-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    /* Phone first: every control is at least a 44px touch target; advanced areas fold away. */
    .button, .button.small, input, select { min-height: 44px; }
    details.fold { margin: 0 0 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
    details.fold > summary { display: flex; align-items: center; min-height: 52px; padding: 12px 20px; cursor: pointer; font-weight: 750; }
    details.fold[open] > summary { border-bottom: 1px solid var(--line); }
    details.fold > .panel { margin: 16px; box-shadow: none; }
    details.fold.inner { margin: 14px 0; border-radius: 12px; background: var(--surface-2); }
    details.fold.inner > summary { min-height: 44px; padding: 10px 14px; font-weight: 650; font-size: .9rem; }
    details.fold.inner > :not(summary) { margin-left: 14px; margin-right: 14px; }
    #dashboard > section[aria-labelledby="audit-heading"] { margin-bottom: 24px; }
    @media (max-width: 780px) { .columns { grid-template-columns: 1fr; } header { align-items: flex-start; } .header-note { display: none; } }
    @media (max-width: 510px) { .shell { width: min(100% - 22px, 1280px); } .hero-stats { width: 100%; } .stat { flex: 1; } .form-grid { grid-template-columns: 1fr; } .form-grid .wide { grid-column: auto; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><div class="brand-mark" aria-hidden="true">M</div><div><strong data-i18n="brand.name"></strong><small data-i18n="header.subtitle"></small></div></div>
      <div class="header-side"><span class="badge" data-i18n="header.badge"></span><span class="header-note" data-i18n="header.note"></span><a id="lang-toggle" class="button small" href="?lang=zh" data-i18n="lang.toggle" data-i18n-aria-label="lang.toggleAria"></a><button id="logout" class="button small" type="button" data-i18n="header.logout" hidden></button></div>
    </header>
    <main>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <section id="login-view" class="panel login" aria-labelledby="login-heading">
        <h2 id="login-heading" data-i18n="login.heading"></h2>
        <div class="phone-pair">
          <h3 data-i18n="phone.pair.heading"></h3>
          <p class="hint" data-i18n="phone.pair.intro"></p>
          <button id="phone-unlock" class="button primary full" type="button" data-i18n="phone.unlock.button" hidden></button>
          <form id="phone-pair-form">
            <div class="field"><label for="phone-pair-code" data-i18n="phone.pair.code"></label><input id="phone-pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" required></div>
            <div class="field"><label for="phone-pair-name" data-i18n="phone.pair.name"></label><input id="phone-pair-name" maxlength="20" autocomplete="nickname" required></div>
            <button id="phone-pair-submit" class="button primary full" type="submit" data-i18n="phone.pair.submit"></button>
          </form>
          <output id="phone-pair-status" role="status" aria-live="polite"></output>
        </div>
        <h3 data-i18n="login.passcodeAlt"></h3>
        <p data-i18n="login.intro"></p>
        <form id="login-form">
          <div class="field"><label for="passcode" data-i18n="login.passcode.label"></label><input id="passcode" name="passcode" type="password" autocomplete="off" required><span class="hint" data-i18n="login.passcode.hint"></span></div>
          <button class="button primary full" type="submit" data-i18n="login.submit"></button>
        </form>
      </section>
      <div id="dashboard" hidden>
        <section class="hero" aria-labelledby="page-heading">
          <div><h1 id="page-heading" data-i18n="hero.heading"></h1><p data-i18n="hero.intro"></p><div class="connection"><span data-i18n="hero.endpoint"></span><code id="mcp-endpoint"></code><button id="copy-token" class="button small" type="button" data-i18n="hero.copyToken"></button><span data-i18n="hero.tokenNote"></span></div></div>
          <div class="hero-stats" data-i18n-aria-label="hero.statsAria"><div class="stat"><strong id="device-count">7</strong><span data-i18n="hero.stat.devices"></span></div><div class="stat"><strong id="paired-count">0</strong><span data-i18n="hero.stat.paired"></span></div><div class="stat"><strong id="schedule-count">0</strong><span data-i18n="hero.stat.schedules"></span></div></div>
        </section>
        <section id="ring-connect" class="panel section-panel admin-only" aria-labelledby="ring-connect-heading">
          <details id="ring-connect-fold" class="ring-connect-fold" open>
            <summary><span id="ring-connect-heading" data-i18n="ringConnect.heading"></span> <span id="ring-connect-state" class="pill-state" role="status" aria-live="polite"></span></summary>
            <ol class="ring-steps">
              <li><span class="step-num">1</span><div><b data-i18n="ringConnect.step1"></b><a id="ring-connect-open" class="button" href="https://developer.amazon.com/ring/console/playground" target="_blank" rel="noopener noreferrer" data-i18n="ringConnect.open"></a></div></li>
              <li><span class="step-num">2</span><div><b data-i18n="ringConnect.step2"></b><button id="ring-connect-paste" class="button" type="button" data-i18n="ringConnect.pasteButton"></button>
                <form id="ring-connect-form" autocomplete="off"><label class="ring-token-label"><span data-i18n="ringConnect.paste"></span><input id="ring-connect-token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="4096"></label></form></div></li>
              <li><span class="step-num">3</span><div><b data-i18n="ringConnect.step3"></b><div class="door-actions"><button id="ring-connect-save" class="button primary" type="submit" form="ring-connect-form" data-i18n="ringConnect.connect"></button><button id="ring-connect-clear" class="button" type="button" data-i18n="ringConnect.disconnect"></button></div></div></li>
            </ol>
            <p class="hint" data-i18n="ringConnect.intro"></p>
            <p id="ring-connect-result" class="hint" role="status" aria-live="polite"></p>
          </details>
        </section>
        <section id="guardian-panel" class="panel section-panel guardian" aria-labelledby="guardian-heading">
          <div class="guardian-head"><h2 id="guardian-heading" data-i18n="guardian.heading"></h2><span id="guardian-clock" class="hint"></span></div>
          <p id="guardian-overall" class="guardian-overall" role="status" aria-live="polite" data-i18n="guardian.loading"></p>
          <div id="door-banner" class="door-banner" role="alert" hidden>
            <p id="door-banner-text" class="door-ask"></p>
            <img id="door-snapshot" alt="" hidden>
            <p id="door-snapshot-note" class="hint"></p>
            <p id="door-face-hint" class="door-face"></p>
            <div class="door-actions"><button id="door-live-toggle" class="button" type="button" data-i18n="door.liveStart"></button></div>
            <video id="door-live" class="door-live" autoplay playsinline muted hidden></video>
            <p id="door-live-note" class="hint" role="status" aria-live="polite"></p>
            <div class="door-actions"><button id="door-approve" class="button primary" type="button" data-i18n="door.approve"></button><button id="door-deny" class="button danger" type="button" data-i18n="door.deny"></button></div>
            <p class="hint" data-i18n="door.simulatedNote"></p>
          </div>
          <p id="door-mine" class="hint" role="status" aria-live="polite"></p>
          <div id="pair-banner" class="door-banner" role="alert" hidden>
            <p id="pair-banner-text" class="door-ask"></p>
            <p class="hint" data-i18n="pairReq.note"></p>
            <div class="door-actions"><button id="pair-allow" class="button primary" type="button" data-i18n="pairReq.allow"></button><button id="pair-deny" class="button danger" type="button" data-i18n="pairReq.deny"></button></div>
          </div>
          <p id="pair-result" class="hint" role="status" aria-live="polite"></p>
          <div class="guardian-cards">
            <div class="stat"><strong id="guardian-camera">—</strong><span data-i18n="guardian.target.camera"></span><small id="guardian-camera-note"></small></div>
            <div class="stat"><strong id="guardian-gateway">—</strong><span data-i18n="guardian.target.gateway"></span><small id="guardian-gateway-note"></small></div>
            <div class="stat"><strong id="guardian-routine">—</strong><span data-i18n="guardian.routineLabel"></span></div>
          </div>
          <p id="guardian-email" class="hint"></p>
          <h3 data-i18n="guardian.todayHeading"></h3>
          <ul id="guardian-today" class="list"></ul>
          <h3 data-i18n="guardian.eventsHeading"></h3>
          <ul id="guardian-events" class="list audit"></ul>
          <div class="ring-discovery-controls admin-only">
            <button id="guardian-camera-off" class="button" type="button" data-i18n="guardian.simCameraOff"></button>

  <div id="dialog-root"></div>
  <script>
    "use strict";

    // All user-visible text comes from the mapping table (public/i18n-map.mjs, loaded as a module and exposed as
    // globalThis.HomeMcpI18n). Before it loads, tr() returns the key; the "home-mcp-i18n-ready" event re-renders.
    function tr(key, params) {
      const i18n = globalThis.HomeMcpI18n;
      return i18n && typeof i18n.t === "function" ? i18n.t(key, params) : key;
    }
    const META = {
      robot_vacuum: { icon: "◇", actions: ["start", "pause", "dock"] },
      air_conditioner: { icon: "❄", actions: ["on", "off", "set_temperature"] },
      front_door: { icon: "▣", actions: ["lock", "unlock"] },
      alarm_clock: { icon: "◷", actions: ["set_alarm", "clear_alarm"] },
      living_light: { icon: "☼", actions: ["on", "off"] },
      camera: { icon: "◎", actions: ["arm", "disarm"] },
      dehumidifier: { icon: "♧", actions: ["on", "off", "set_target_humidity"] }
    };
    const hasMeta = id => Object.prototype.hasOwnProperty.call(META, id);
    const SAFE_SCHEDULE = {
      robot_vacuum: ["start", "pause", "dock"],
      air_conditioner: ["on", "off", "set_temperature"],
      front_door: ["lock"],
      alarm_clock: ["set_alarm", "clear_alarm"],
      living_light: ["on", "off"],
      camera: ["arm"],
      dehumidifier: ["on", "off", "set_target_humidity"]
    };
    const PARAMS = {
      set_temperature: { key: "temperature", labelKey: "param.temperature", type: "number", min: 16, max: 30, placeholder: "24" },
      set_alarm: { key: "time", labelKey: "param.time", type: "time" },
      set_target_humidity: { key: "humidity", labelKey: "param.humidity", type: "number", min: 30, max: 80, placeholder: "55" }
    };
    const el = id => document.getElementById(id);
    let token = null;
    let role = null;
    let state = null;
    let busy = false;
    let nextRpcId = 1;
    let lastBatchResults = null;
    let ringDeviceCount = 0;
    let ringOperatorGeneration = 0;
    let ringOperatorDiagnostic = freshRingOperatorDiagnostic();

    function freshRingOperatorDiagnostic() {
      return { currentLength: 0, hasWhitespace: false, inputAt: null, operation: "NONE", submittedLength: null, submittedAt: null, clearedAt: null, phase: "IDLE", gate: "NOT_CHECKED", resultCode: "NOT_STARTED" };
    }
    function renderRingOperatorDiagnostic() {
      const info = ringOperatorDiagnostic;
      const pick = (prefix, names) => Object.fromEntries(names.map(name => [name, tr(prefix + name)]));
      const operations = pick("ring.diag.op.", ["NONE", "IMPORT", "DISCOVERY", "HISTORY", "CAPTURE"]);
      const gates = pick("ring.diag.gate.", ["NOT_CHECKED", "PENDING", "PASSED", "DENIED", "UNAVAILABLE", "LIMITED", "UNKNOWN"]);
      const phases = pick("ring.diag.phase.", ["IDLE", "NOT_SENT", "SENDING", "COMPLETE"]);
      const outcomes = pick("ring.diag.outcome.", ["LOCAL_IMPORT_OK", "DISCOVERY_OK", "HISTORY_OK", "CAPTURE_PENDING", "DISCOVERY_HTTP_401", "DISCOVERY_HTTP_403", "DISCOVERY_TIMEOUT", "DISCOVERY_NETWORK_ERROR", "DISCOVERY_NOT_SUCCESSFUL", "INPUT_EMPTY", "NOT_STARTED", "PENDING"]);
      const at = value => value ? formatTime(value) : tr("ring.diag.none");
      const sent = info.submittedAt ? tr("ring.diag.sent", { length: info.submittedLength, at: at(info.submittedAt) }) : tr("ring.diag.notSent");
      el("ring-operator-diagnostic").textContent = tr("ring.diag.text", { length: info.currentLength, whitespace: info.hasWhitespace ? tr("ring.diag.whitespace") : "", inputAt: at(info.inputAt), operation: operations[info.operation], sent, clearedAt: at(info.clearedAt), phase: phases[info.phase], gate: gates[info.gate], outcome: outcomes[info.resultCode] || tr("ring.diag.outcome.fallback"), code: info.resultCode });
    }
    function rememberRingOperatorInput() {
      ringOperatorDiagnostic.currentLength = el("ring-operator-passcode").value.length;
      ringOperatorDiagnostic.hasWhitespace = /\s/.test(el("ring-operator-passcode").value);
      ringOperatorDiagnostic.inputAt = new Date().toISOString();
      renderRingOperatorDiagnostic();
    }
    function beginRingOperatorAttempt(operation) {
      const length = el("ring-operator-passcode").value.length;
      ringOperatorDiagnostic.currentLength = length;
      ringOperatorDiagnostic.hasWhitespace = /\s/.test(el("ring-operator-passcode").value);
      ringOperatorDiagnostic.operation = operation;
      ringOperatorDiagnostic.submittedLength = length;
      ringOperatorDiagnostic.submittedAt = length === 0 ? null : new Date().toISOString();
      ringOperatorDiagnostic.clearedAt = null;
      ringOperatorDiagnostic.phase = length === 0 ? "NOT_SENT" : "SENDING";
      ringOperatorDiagnostic.gate = length === 0 ? "NOT_CHECKED" : "PENDING";
      ringOperatorDiagnostic.resultCode = length === 0 ? "INPUT_EMPTY" : "PENDING";
      renderRingOperatorDiagnostic();
      return length === 0 ? null : ringOperatorGeneration;
    }
    function clearRingOperatorValue(generation) {
      if (generation !== ringOperatorGeneration) return;
      el("ring-operator-passcode").value = "";
      ringOperatorDiagnostic.currentLength = 0;
      ringOperatorDiagnostic.hasWhitespace = false;
      ringOperatorDiagnostic.clearedAt = new Date().toISOString();
      renderRingOperatorDiagnostic();
    }
    function finishRingOperatorAttempt(generation, code) {
      if (generation !== ringOperatorGeneration) return;
      const results = {
        LOCAL_IMPORT_OK: "PASSED", DISCOVERY_OK: "PASSED", HISTORY_OK: "PASSED", CAPTURE_PENDING: "PASSED",
        RING_OPERATOR_DENIED: "DENIED", RING_OPERATOR_UNAVAILABLE: "UNAVAILABLE", RING_OPERATOR_RATE_LIMIT: "LIMITED",
        IMPORT_BUSY: "PASSED", DISCOVERY_BUSY: "PASSED", HISTORY_BUSY: "PASSED", CLIPBOARD_UNAVAILABLE: "PASSED", RING_TOKEN_INVALID: "PASSED",
        TOKEN_UNAVAILABLE: "PASSED", TOKEN_INVALID: "PASSED", DEVICE_NOT_FOUND: "PASSED",
        DISCOVERY_HTTP_401: "PASSED", DISCOVERY_HTTP_403: "PASSED", DISCOVERY_HTTP_404: "PASSED",
        DISCOVERY_TIMEOUT: "PASSED", DISCOVERY_NETWORK_ERROR: "PASSED", DISCOVERY_NOT_SUCCESSFUL: "PASSED",
        HISTORY_HTTP_401: "PASSED", HISTORY_HTTP_403: "PASSED", HISTORY_HTTP_404: "PASSED",
      };
      const known = Object.prototype.hasOwnProperty.call(results, code);
      ringOperatorDiagnostic.resultCode = known ? Object.keys(results).find(value => value === code) : "OTHER_ERROR";
      ringOperatorDiagnostic.gate = known ? results[code] : "UNKNOWN";
      ringOperatorDiagnostic.phase = "COMPLETE";
      renderRingOperatorDiagnostic();
    }
    function resetRingOperatorDiagnostic() {
      ringOperatorGeneration++;
      ringOperatorDiagnostic = freshRingOperatorDiagnostic();
      renderRingOperatorDiagnostic();
    }

    function setRingDeviceOptions(count) {
      const choices = ['<option value="">' + (count === 0 ? tr("ring.historyDevice.queryFirst") : tr("ring.historyDevice.choose")) + '</option>'];
      for (let ordinal = 1; ordinal <= count; ordinal++) {
        choices.push(`<option value="${ordinal}">${tr("ring.historyDevice.item", { n: ordinal })}</option>`);
      }
      el("ring-history-device").innerHTML = choices.join("");
    }

    function showNotice(message, isError = false) {
      const node = el("notice");
      node.textContent = message;
      node.className = "notice show" + (isError ? " error" : "");
    }
    function clearNotice() { el("notice").className = "notice"; el("notice").textContent = ""; }
    function setBusy(value) {
      busy = value;
      document.querySelectorAll("button:not([data-wifi-authorize]):not([data-wifi-revoke])").forEach(button => { if (button.id !== "logout") button.disabled = value; });
      el("ring-operator-passcode").disabled = value;
      if (!value && state) renderEdge();
    }
    async function request(path, method = "GET", body, extraHeaders = {}) {
      const headers = { Accept: "application/json" };
      if (body !== undefined) headers["Content-Type"] = "application/json";
      if (token) headers.Authorization = "Bearer " + token;
      Object.assign(headers, extraHeaders);
      const response = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body), credentials: "same-origin" });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (response.status === 401 && path !== "/api/login") logout(false);
        const error = new Error(data.message || data.error || `HTTP ${response.status}`);
        error.code = data.code || data.error_code || data.error || "HTTP_ERROR";
        throw error;
      }
      return data;
    }
    globalThis.cloudMcpPanelPorts = Object.freeze({
      authorization: () => (token ? "Bearer " + token : null),
      unauthorized: () => logout(false)
    });
    // Phone pairing (public/phone-pair.mjs) hands a phone session in here; the same dashboard then runs with that role.
    function setRole(value) {
      role = value;
      if (value) document.body.dataset.role = value; else delete document.body.dataset.role;
      globalThis.dispatchEvent(new Event('home-mcp-session-changed'));
    }
    globalThis.homeMcpSessionPorts = Object.freeze({
      role: () => role,
      request: (path, method, body) => request(path, method, body),
      // Door approval (public/door.mjs): the decision answer carries the rotated phone credential even when it is a refusal,
      // so it needs the status and body as they are; the snapshot is an image, not JSON.
      call: async (path, body) => {
        const response = await fetch(path, { method: "POST", headers: { Accept: "application/json", "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
          body: JSON.stringify(body), credentials: "same-origin", cache: "no-store" });
        return { ok: response.ok, status: response.status, data: await response.json().catch(() => ({})) };
      },
      image: async (path) => {
        const response = await fetch(path, { headers: token ? { Authorization: "Bearer " + token } : {}, credentials: "same-origin", cache: "no-store" });
        return response.ok ? { blob: await response.blob(), source: response.headers.get("x-snapshot-source") } : null;
      },
      // Silent hand-over to a fresh one-hour session from the same paired phone: no re-render, no notice.
      renew: (sessionToken) => { if (token && typeof sessionToken === "string") token = sessionToken; },
      accept: async (sessionToken, info) => {
        token = sessionToken;
        await refresh();
        el("login-view").hidden = true;

        const finish = value => { document.removeEventListener("keydown", escape); root.replaceChildren(); resolve(value); };
        cancel.addEventListener("click", () => finish(null));
        backdrop.addEventListener("click", event => { if (event.target === backdrop) finish(null); });
        dialog.addEventListener("submit", event => { event.preventDefault(); finish(input.value); });
        const escape = event => { if (event.key === "Escape") finish(null); };
        document.addEventListener("keydown", escape);
        input.focus();
      });
    }
    async function pairDevice(device) {
      const started = await request("/api/pair/start", "POST", { deviceId: device.id });
      const description = device.id === "front_door"
        ? tr("pair.description.front_door", { at: formatTime(started.expiresAt) })
        : device.id === "air_conditioner"
          ? tr("pair.description.air_conditioner", { at: formatTime(started.expiresAt) })
          : tr("pair.description.generic", { at: formatTime(started.expiresAt) });
      const entered = await openDialog({ title: tr("pair.title", { name: nameFor(device.id) }), description, code: started.code, codeLabel: tr("pair.codeLabel"), inputLabel: tr("pair.inputLabel"), confirmLabel: tr("pair.confirm") });
      if (entered === null) return;
      await request("/api/pair/confirm", "POST", { deviceId: device.id, code: entered.trim() });
      await refresh(); showNotice(tr("notice.paired", { name: nameFor(device.id) }), false);
    }
    async function askParameter(action) {
      const config = PARAMS[action];
      if (!config) return {};
      const entered = await openDialog({ title: actionFor("", action), description: tr("param.dialogDescription"), inputLabel: tr(config.labelKey), inputType: config.type, confirmLabel: tr("common.continue") });
      if (entered === null) return null;
      const value = config.type === "number" ? Number(entered) : entered;
      if (config.type === "number" && (!Number.isInteger(value) || value < config.min || value > config.max)) throw new Error(tr("param.range", { label: tr(config.labelKey), min: config.min, max: config.max }));
      if (config.type === "time" && !/^([01]\d|2[0-3]):[0-5]\d$/.test(value)) throw new Error(tr("param.timeInvalid"));
      return { [config.key]: value };
    }
    async function performAction(device, action) {
      const parameters = await askParameter(action);
      if (parameters === null) return;
      let confirmationId;
      let confirmationPhrase;
      if (device.id === "front_door" && action === "unlock") {
        // Asking only: the admin phone approves (public/door.mjs follows the answer).
        const asked = await request("/api/door/request", "POST", {});
        showNotice(tr("door.asked", { seconds: String(asked.secondsLeft ?? 60) }), false);
        globalThis.dispatchEvent(new CustomEvent("home-mcp-door-asked", { detail: { requestId: asked.requestId } }));
        return;
      }
      const result = await request("/api/action", "POST", { deviceId: device.id, action, parameters, confirmationId, confirmationPhrase });
      await refresh();
      if (result.simulated !== true) throw new Error(tr("notice.notSimulated"));
      if (result.status === "simulated_applied") {
        showNotice(tr("notice.actionApplied", { name: nameFor(device.id), action: actionFor(device.id, action) }), false);
      } else if (result.status === "queued") {
        showNotice(tr("notice.actionQueued", { name: nameFor(device.id), action: actionFor(device.id, action) }), false);
      } else {
        showNotice(tr("notice.actionOther", { name: nameFor(device.id), status: edgeStatusLabel(result.status) }), result.status !== "expired");
      }
    }
    async function run(operation) {
      if (busy) return;
      clearNotice(); setBusy(true);
      try { await operation(); }
      catch (error) { showNotice(error.message || tr("notice.operationFailed"), true); }
      finally { setBusy(false); }
    }
    el("login-form").addEventListener("submit", event => {
      event.preventDefault();
      run(async () => {
        const passcode = el("passcode").value;
        const response = await request("/api/login", "POST", { passcode });
        token = response.token;
        setRole("admin");
        el("passcode").value = "";
        await refresh();
        el("login-view").hidden = true;
        el("dashboard").hidden = false;
        el("logout").hidden = false;
        globalThis.dispatchEvent(new Event('wifi-permission-session-refresh'));
        showNotice(tr("notice.loggedIn"), false);
      });
    });
    el("logout").addEventListener("click", () => run(async () => {
      globalThis.dispatchEvent(new Event('home-mcp-manual-logout'));   // a deliberate logout must not reopen by itself
      await request("/api/logout", "POST", {});
      logout();
    }));
    el("mcp-endpoint").textContent = location.origin + "/mcp";
    el("copy-token").addEventListener("click", () => run(async () => {
      if (!token) throw new Error(tr("notice.loginFirst"));
      if (!navigator.clipboard?.writeText) throw new Error(tr("notice.clipboardUnsupported"));
      await navigator.clipboard.writeText(token);
      showNotice(tr("notice.tokenCopied"), false);
    }));
    el("refresh").addEventListener("click", () => run(async () => { await refresh(); showNotice(tr("notice.refreshed"), false); }));
    el("ring-operator-passcode").addEventListener("input", rememberRingOperatorInput);
    renderRingOperatorDiagnostic();
    globalThis.addEventListener?.("home-mcp-i18n-ready", () => { renderRingOperatorDiagnostic(); if (state) { render(); renderLocalRing(); } });
    el("ring-import").addEventListener("click", () => run(importRingToken));
    el("ring-discover").addEventListener("click", () => run(discoverRing));
    el("ring-capture").addEventListener("click", () => run(captureRingReceipt));
    for (const operation of ["link", "motion", "worker", "remove"]) {
      el(`local-ring-${operation}`).addEventListener("click", () => run(() => localRingOperation(operation)));
    }
    el("local-ring-offline").addEventListener("click", () => run(() => localRingOperation("online", { online: false })));
    el("local-ring-online").addEventListener("click", () => run(() => localRingOperation("online", { online: true })));
    el("ring-history").addEventListener("click", () => run(probeRingHistory));
    el("edge-disconnect").addEventListener("click", () => run(async () => {
      await request("/api/edge/online", "POST", { online: false });
      await refresh(); showNotice(tr("notice.edgeDisconnected"), false);
    }));
    el("edge-reconnect").addEventListener("click", () => run(async () => {
      await request("/api/edge/online", "POST", { online: true });
      await refresh(); showNotice(tr("notice.edgeReconnected"), false);
    }));
    el("edge-heartbeat-button").addEventListener("click", () => run(async () => {
      await request("/api/edge/heartbeat", "POST", {});
      await refresh(); showNotice(tr("notice.heartbeatSent"), false);
    }));
    el("edge-scene").addEventListener("click", () => run(async () => {
      lastBatchResults = null;
      renderEdge();
      const result = await callSimulatedDeviceTool("device_batch", { commands: HOME_ARRIVAL_COMMANDS });
      if (!Array.isArray(result.results) || result.results.length !== HOME_ARRIVAL_COMMANDS.length
        || !result.results.every((item, index) => item?.deviceId === HOME_ARRIVAL_COMMANDS[index].deviceId
          && item?.action === HOME_ARRIVAL_COMMANDS[index].action)) {
        throw new Error(tr("notice.sceneUnverified"));
      }
      lastBatchResults = result.results;
      await refresh();
      const applied = result.results.filter(item => item.status === "simulated_applied").length;
      const queued = result.results.filter(item => item.status === "queued").length;
      showNotice(tr("notice.sceneResult", { total: result.results.length, applied, queued, other: result.results.length - applied - queued }), false);
    }));
    el("schedule-device").addEventListener("change", renderScheduleActions);
    el("schedule-action").addEventListener("change", renderParameterField);
    el("schedule-form").addEventListener("submit", event => {
      event.preventDefault();
      run(async () => {
        const deviceId = el("schedule-device").value;
        const action = el("schedule-action").value;
        if (!(SAFE_SCHEDULE[deviceId] || []).includes(action)) throw new Error(tr("schedule.notAllowed"));
        const config = PARAMS[action];
        const parameters = {};
        if (config) {
          const raw = el("schedule-param").value;
          const value = config.type === "number" ? Number(raw) : raw;
          if (config.type === "number" && (!Number.isInteger(value) || value < config.min || value > config.max)) throw new Error(tr("schedule.paramOutOfRange", { label: tr(config.labelKey) }));
          if (config.type === "time" && !/^([01]\d|2[0-3]):[0-5]\d$/.test(value)) throw new Error(tr("schedule.alarmInvalid"));
          parameters[config.key] = value;
        }
        const rawAt = el("schedule-at").value.trim();
        if (!/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(rawAt)) throw new Error(tr("schedule.atFormat"));
        const selectedTime = new Date(rawAt.replace(" ", "T"));
        if (Number.isNaN(selectedTime.getTime()) || selectedTime.getTime() <= Date.now()) throw new Error(tr("schedule.mustBeFuture"));
        await request("/api/schedules", "POST", { deviceId, action, parameters, at: selectedTime.toISOString() });
        el("schedule-form").reset();
        await refresh(); showNotice(tr("notice.scheduleAdded"), false);
      });
    });
  </script>
