<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="880" viewBox="0 0 1920 880" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5eeaa8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2c94c"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="880" fill="#0b0f14"/>
  <text x="70" y="78" font-size="46" font-weight="700" fill="#f0f4f8">How it works</text>
  <text x="70" y="118" font-size="24" fill="#96a0af">Ring Playground (sandbox) confirms the owner · our own MCP decides what is allowed · the Mac proves what it did</text>

  <!-- Owner -->
  <g>
    <rect x="70" y="200" width="300" height="250" rx="20" fill="#141b24" stroke="#5eeaa8" stroke-width="3"/>
    <text x="220" y="250" font-size="30" font-weight="700" fill="#f0f4f8" text-anchor="middle">Owner</text>
    <text x="220" y="292" font-size="20" fill="#96a0af" text-anchor="middle">Ring Developer Playground</text>
    <text x="220" y="320" font-size="20" fill="#96a0af" text-anchor="middle">official API (sandbox)</text>
    <text x="220" y="362" font-size="20" fill="#96a0af" text-anchor="middle">Cognito login + MFA</text>
    <text x="220" y="404" font-size="18" fill="#5eeaa8" text-anchor="middle">Ring account pinned</text>
    <text x="220" y="428" font-size="18" fill="#5eeaa8" text-anchor="middle">to the owner (24 h)</text>
  </g>

  <!-- AWS cloud group -->
  <rect x="450" y="160" width="760" height="420" rx="26" fill="none" stroke="#2d3a4a" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="480" y="198" font-size="22" font-weight="700" fill="#f2c94c">AWS · real deployment</text>
  <g>
    <rect x="480" y="225" width="200" height="120" rx="16" fill="#141b24" stroke="#5eeaa8" stroke-width="2.5"/>
    <text x="580" y="275" font-size="24" font-weight="700" fill="#f0f4f8" text-anchor="middle">Cognito</text>
    <text x="580" y="308" font-size="18" fill="#96a0af" text-anchor="middle">MFA · PKCE</text>
    <rect x="720" y="225" width="200" height="120" rx="16" fill="#141b24" stroke="#5eeaa8" stroke-width="2.5"/>
    <text x="820" y="275" font-size="24" font-weight="700" fill="#f0f4f8" text-anchor="middle">API Gateway</text>
    <text x="820" y="308" font-size="18" fill="#96a0af" text-anchor="middle">pinned admission</text>
    <rect x="960" y="225" width="220" height="120" rx="16" fill="#141b24" stroke="#5eeaa8" stroke-width="2.5"/>
    <text x="1070" y="275" font-size="24" font-weight="700" fill="#f0f4f8" text-anchor="middle">Lambda</text>
    <text x="1070" y="308" font-size="18" fill="#96a0af" text-anchor="middle">our own MCP server</text>
    <rect x="480" y="395" width="700" height="160" rx="16" fill="#101820" stroke="#5eeaa8" stroke-width="2.5"/>
    <text x="510" y="438" font-size="22" font-weight="700" fill="#f0f4f8">MCP tools</text>
    <text x="510" y="472" font-size="20" fill="#5eeaa8" font-family="Menlo, monospace">home_device.command {deviceId, action}</text>
    <text x="510" y="502" font-size="20" fill="#5eeaa8" font-family="Menlo, monospace">home_device.result  {commandId}</text>
    <text x="510" y="536" font-size="18" fill="#96a0af">allowlist only · DynamoDB single-use queue · KMS · 30 s TTL</text>
  </g>

  <!-- Mac -->
  <g>
    <rect x="1290" y="200" width="270" height="250" rx="20" fill="#141b24" stroke="#5eeaa8" stroke-width="3"/>
    <text x="1425" y="250" font-size="30" font-weight="700" fill="#f0f4f8" text-anchor="middle">Owner's Mac</text>
    <text x="1425" y="292" font-size="20" fill="#96a0af" text-anchor="middle">enrolled Ed25519 key</text>
    <text x="1425" y="326" font-size="20" fill="#96a0af" text-anchor="middle">fetch · verify proof</text>
    <text x="1425" y="360" font-size="20" fill="#96a0af" text-anchor="middle">apply once · journal</text>
    <text x="1425" y="404" font-size="18" fill="#5eeaa8" text-anchor="middle">receipt (signed proof)</text>
  </g>

  <!-- Devices -->
  <g>
    <rect x="1640" y="160" width="230" height="420" rx="20" fill="#141b24" stroke="#5eeaa8" stroke-width="3"/>
    <text x="1755" y="205" font-size="26" font-weight="700" fill="#f0f4f8" text-anchor="middle">7 devices</text>
    <text x="1755" y="232" font-size="17" fill="#f2c94c" text-anchor="middle">software-simulated</text>
    <g font-size="20" fill="#dfe6ee">
      <text x="1675" y="280">• Living room light</text>
      <text x="1675" y="314">• Air conditioner</text>
      <text x="1675" y="348">• Dehumidifier</text>
      <text x="1675" y="382">• Robot vacuum</text>
      <text x="1675" y="416">• Camera (arm)</text>
      <text x="1675" y="450">• Door lock (lock)</text>
      <text x="1675" y="484">• Alarm (local only)</text>
    </g>
    <text x="1755" y="530" font-size="17" fill="#5eeaa8" text-anchor="middle">pair locally first</text>
    <text x="1755" y="554" font-size="17" fill="#5eeaa8" text-anchor="middle">every action audited</text>
  </g>

  <!-- arrows -->
  <path d="M370 285 L472 285" stroke="#5eeaa8" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <path d="M680 285 L712 285" stroke="#5eeaa8" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <path d="M920 285 L952 285" stroke="#5eeaa8" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <path d="M1070 345 L1070 387" stroke="#5eeaa8" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <path d="M1180 450 L1282 360" stroke="#5eeaa8" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <text x="1216" y="470" font-size="17" fill="#96a0af">signed</text><text x="1216" y="492" font-size="17" fill="#96a0af">fetch</text>
  <path d="M1560 325 L1632 325" stroke="#5eeaa8" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <!-- receipt back -->
  <path d="M1425 450 L1425 640 L830 640 L830 563" stroke="#f2c94c" stroke-width="4" fill="none" marker-end="url(#b)" filter="url(#glow)"/>
  <text x="900" y="680" font-size="24" font-weight="700" fill="#f2c94c">receipt → MCP reads the same command back: executed = true</text>

  <!-- guarantees -->
  <g font-size="20" fill="#0b0f14" font-weight="700">
    <rect x="70" y="740" width="390" height="70" rx="35" fill="#5eeaa8"/><text x="265" y="783" text-anchor="middle">Only a Ring-verified owner (sandbox)</text>
    <rect x="490" y="740" width="420" height="70" rx="35" fill="#5eeaa8"/><text x="700" y="783" text-anchor="middle">Allowlisted, single-use commands</text>
    <rect x="940" y="740" width="420" height="70" rx="35" fill="#5eeaa8"/><text x="1150" y="783" text-anchor="middle">No unlock / disarm from cloud</text>
    <rect x="1390" y="740" width="460" height="70" rx="35" fill="#5eeaa8"/><text x="1620" y="783" text-anchor="middle">Executed only after a verified receipt</text>
  </g>
</svg>
